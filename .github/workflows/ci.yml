name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Run pytest
        run: pytest

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src/bullhorn_mcp
