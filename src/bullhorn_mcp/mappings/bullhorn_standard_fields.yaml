    standard_fields:
      - id
      - dateAdded
      - firstName
      - lastName
      - email
      - phone
      - occupation
      - status
      - clientCorporation
      - owner
    default_mappings:
      id: id
      date_added: dateAdded
      first_name: firstName
      last_name: lastName
      full_name: "{firstName} {lastName}"
      email: email
      phone: phone
      title: occupation
      status: status
      client_corporation_id: { field: clientCorporation, key: id }
      owner_id: { field: owner, key: id }

  Appointment:
    canonical_entity: appointment
    standard_fields:
      - id
      - dateAdded
      - subject
      - type
      - description
      - location
      - dateBegin
      - dateEnd
      - candidateReference
