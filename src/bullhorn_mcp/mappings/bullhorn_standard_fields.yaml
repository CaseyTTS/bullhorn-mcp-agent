      - owner
    default_mappings:
      id: id
      date_added: dateAdded
      subject: subject
      type: type
      description: description
      location: location
      start_at: dateBegin
      end_at: dateEnd
      candidate_id: { field: candidateReference, key: id }
      client_contact_id: { field: clientContactReference, key: id }
      job_id: { field: jobOrder, key: id }
      owner_id: { field: owner, key: id }

  Note:
    canonical_entity: note
    standard_fields:
      - id
      - dateAdded
      - action
      - comments
      - personReference
      - commentingPerson
      - jobOrder
      - isDeleted
    default_mappings:
      id: id
      date_added: dateAdded
      action: action
      body: comments
      person_id: { field: personReference, key: id }
      author_id: { field: commentingPerson, key: id }
