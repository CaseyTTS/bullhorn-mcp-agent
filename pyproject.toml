[project]
name = "bullhorn-mcp-agent"
version = "0.1.0"
description = "MCP server for Bullhorn CRM - query jobs and candidates via natural language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "cryptography>=42",
    "PyJWT>=2.8",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML",
]

[project.scripts]
bullhorn-mcp = "bullhorn_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bullhorn_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]

# Pre-existing unused imports in test fixture/helper modules that are out of
# scope for this phase (see docs/process/BUILDER.md Phase 0 work package).
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["F401"]
"tests/test_client.py" = ["F401"]
"tests/test_config.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
